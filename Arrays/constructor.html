<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Constructors</h1>
<h2>The Array() Constructor</h2>

<p id="demo"></p>

<script>
const a = new Array();
const b = new Array(3);
const c = new Array("3");
const d = new Array("Saab", "Volvo", "BMW");

document.getElementById("demo").innerHTML =
JSON.stringify(a) + "<br>" +
JSON.stringify(b) + "<br>" +
JSON.stringify(c) + "<br>" +
JSON.stringify(d);
</script>

</body>
</html>
