<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS-Scopes</title>
</head>
<body>
  <h1>JavaScript Scopes</h1>
  <p>A GLOBAL variable can be accessed from any script or function.</p>
  <p id="demo"></p>
    

   <script> 
    let carName = "Maroti"
    myFunction();

    function myFunction(){
      document.getElementById("demo").innerHTML =carName +" car is my fav one"
    }
   </script>
</body>
</html>
